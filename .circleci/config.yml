version: 2.1

jobs:
  docker:
    docker:
      - image: cimg/base:current  # Use CircleCI's convenience image
        environment:
          DB_PASSWORD: "$DB_PASSWORD"  # Pass DB_PASSWORD as an environment variable to the container
    steps:
      - checkout  # Step 1: Checkout code

    # Set up Docker-in-Docker
      - setup_remote_docker:
          docker_layer_caching: true
          setup_docker: true
          
      # Install Docker Compose
      - run:
          name: Install `docker-compose`
          command: |
            curl -L https://github.com/docker/compose/releases/download/1.19.0/docker-compose-`uname -s`-`uname -m` > ~/docker-compose
            chmod +x ~/docker-compose
            sudo mv ~/docker-compose /usr/local/bin/docker-compose

      # Login to Docker Hub (if needed for pushing images)
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

      # Build and push the Docker image using Docker Compose
      - run:
          name: Build and Push Docker Image using Docker Compose
          command: |
            docker-compose -f docker-compose.yml build
            docker-compose push 

      # Trigger Render deployment after the build/push
      - run:
          name: Trigger Render Deployment
          command: |
            curl -X POST "$RENDER_DEPLOY_HOOK"

workflows:
  docker-workflow:
    jobs:
      - docker
