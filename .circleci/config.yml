version: 2.1

jobs:
  docker:
    docker:
      - image: cimg/base:current  # Use CircleCI's convenience image
    steps:
      - checkout  # Step 1: Checkout code
      
      - setup_remote_docker  # Step 2: Enable Docker support

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - run:
          name: Build and Push Docker Image
          command: |
            docker build -t bwilfong122/video_app:latest .
            docker push bwilfong122/video_app:latest

      - run:
          name: Trigger Render Deployment
          command: |
            curl -X POST "$RENDER_DEPLOY_HOOK"

workflows:
  version: 2
  docker-workflow:
    jobs:
      - docker
